name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore backend/OpsPulse.Api/OpsPulse.Api.csproj
      - name: Build
        run: dotnet build backend/OpsPulse.Api/OpsPulse.Api.csproj --no-restore --configuration Release

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/opspulse-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install
      - name: Build
        run: npm run build

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t rootbeacon-ci .
      - name: Run and smoke test
        run: |
          docker run -d --name app -p 8080:8080 rootbeacon-ci
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/api/health > /tmp/health.json; then break; fi
            sleep 2
          done
          cat /tmp/health.json
          curl -sf http://localhost:8080/api/incidents | grep -q '\['
          curl -sf http://localhost:8080/ | grep -qi 'RootBeacon'
          curl -sf http://localhost:8080/api/health | grep -q 'sqlite-demo'
          # Demo mode is read-only: writes must be rejected, simulated
          # analysis of seeded incidents must still work.
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8080/api/incidents -H 'Content-Type: application/json' -d '{}')" = "403"
          ID=$(curl -s http://localhost:8080/api/incidents | grep -o '"id":"[^"]*"' | head -1 | cut -d'"' -f4)
          curl -sf -X POST "http://localhost:8080/api/incidents/$ID/analyze" | grep -qi 'simulated'
